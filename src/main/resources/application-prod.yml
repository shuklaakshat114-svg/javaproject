# Production Environment Configuration
# Strict compliance with PRD Section 9.2: No hard-coded secrets or credentials exist in this file.
server:
  port: ${PORT:8080}
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:healthcart}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  thymeleaf:
    cache: true

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  storage:
    root: ${STORAGE_ROOT:/var/healthcart/uploads}
  payment:
    provider: ${PAYMENT_PROVIDER:RAZORPAY}
    key-id: ${PAYMENT_KEY_ID}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  admin:
    bootstrap-email: ${APP_ADMIN_BOOTSTRAP_EMAIL}
    bootstrap-password: ${APP_ADMIN_BOOTSTRAP_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.healthcart: INFO
    org.springframework: WARN
    org.hibernate: WARN
