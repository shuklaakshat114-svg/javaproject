<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body class="bg-light">

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <span class="p-3 bg-teal-subtle rounded-circle text-white d-inline-flex mb-2" style="background-color: #0d9488;">
                                <i class="bi bi-shield-check fs-3"></i>
                            </span>
                            <h3 class="fw-bold mb-1">Create New Password</h3>
                            <p class="text-muted small">Choose a strong password with at least 8 characters.</p>
                        </div>

                        <!-- Feedback Alerts -->
                        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small py-2 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Error</span>
                        </div>

                        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                            <input type="hidden" th:field="*{token}">

                            <div class="mb-3">
                                <label for="password" class="form-label small fw-bold text-muted">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" th:field="*{password}" id="password" required placeholder="Minimum 8 characters">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label small fw-bold text-muted">Confirm New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" th:field="*{confirmPassword}" id="confirmPassword" required placeholder="Re-type password">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Update Password</button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/login}" class="fw-bold text-decoration-none text-primary small">Back to sign in</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
