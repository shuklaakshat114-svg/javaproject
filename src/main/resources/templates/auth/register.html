<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body class="bg-light">

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold mb-1">Create an Account</h3>
                            <p class="text-muted small">Choose your account type to register on HealthCart</p>
                        </div>

                        <!-- Registration Tabs -->
                        <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="registerTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link py-2 fw-semibold" th:classappend="${activeTab != 'seller'} ? 'active' : ''" id="buyer-tab" data-bs-toggle="pill" data-bs-target="#buyer-panel" type="button" role="tab">
                                    <i class="bi bi-person me-1"></i> Buyer Account
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link py-2 fw-semibold" th:classappend="${activeTab == 'seller'} ? 'active' : ''" id="seller-tab" data-bs-toggle="pill" data-bs-target="#seller-panel" type="button" role="tab">
                                    <i class="bi bi-shop me-1"></i> Pharmacy Seller
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="registerTabsContent">
                            <!-- Buyer Registration Form -->
                            <div class="tab-pane fade" th:classappend="${activeTab != 'seller'} ? 'show active' : ''" id="buyer-panel" role="tabpanel">
                                <form th:action="@{/register/buyer}" th:object="${buyerForm}" method="post">
                                    <div class="mb-3">
                                        <label for="buyerName" class="form-label small fw-bold text-muted">Full Name</label>
                                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="buyerName" th:field="*{name}" placeholder="John Doe">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="buyerEmail" class="form-label small fw-bold text-muted">Email Address</label>
                                        <input type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="buyerEmail" th:field="*{email}" placeholder="john@example.com">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="buyerPassword" class="form-label small fw-bold text-muted">Password (min 8 characters)</label>
                                        <input type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="buyerPassword" th:field="*{password}" placeholder="••••••••">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register as Buyer</button>
                                </form>
                            </div>

                            <!-- Seller Registration Form -->
                            <div class="tab-pane fade" th:classappend="${activeTab == 'seller'} ? 'show active' : ''" id="seller-panel" role="tabpanel">
                                <form th:action="@{/register/seller}" th:object="${sellerForm}" method="post">
                                    <div class="mb-3">
                                        <label for="sellerName" class="form-label small fw-bold text-muted">Contact Person Name</label>
                                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="sellerName" th:field="*{name}" placeholder="Dr. S. Kumar">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="sellerBusinessName" class="form-label small fw-bold text-muted">Pharmacy / Enterprise Name</label>
                                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('businessName')} ? 'is-invalid'" id="sellerBusinessName" th:field="*{businessName}" placeholder="Apothecary Meds Pvt Ltd">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="sellerLicenseNo" class="form-label small fw-bold text-muted">Drug / Trade License Number</label>
                                        <input type="text" class="form-control" th:classappend="${#fields.hasErrors('licenseNo')} ? 'is-invalid'" id="sellerLicenseNo" th:field="*{licenseNo}" placeholder="DL-KA-2024-XXXXX">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('licenseNo')}" th:errors="*{licenseNo}"></div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="sellerEmail" class="form-label small fw-bold text-muted">Business Email</label>
                                        <input type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="sellerEmail" th:field="*{email}" placeholder="pharmacy@business.com">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="sellerPassword" class="form-label small fw-bold text-muted">Password (min 8 characters)</label>
                                        <input type="password" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" id="sellerPassword" th:field="*{password}" placeholder="••••••••">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register as Seller</button>
                                </form>
                            </div>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">Already have an account? </span>
                            <a th:href="@{/login}" class="fw-bold text-decoration-none text-primary small">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
