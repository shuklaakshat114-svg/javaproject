<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle != null ? errorTitle : 'Error'} + ' - HealthCart'">Application Error - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center bg-white" style="max-width: 520px;">
        <div class="p-3 bg-danger-subtle rounded-circle d-inline-flex mx-auto mb-3 text-danger">
            <i class="bi bi-exclamation-octagon fs-1"></i>
        </div>
        <h2 class="fw-bold mb-2" th:text="${errorTitle != null ? errorTitle : 'Something Went Wrong'}">Application Error</h2>
        <p class="text-muted small mb-3" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again later.'}">
            An unexpected error occurred.
        </p>

        <div th:if="${traceId != null}" class="p-2 bg-light rounded-3 border small text-muted font-monospace mb-4">
            Incident Reference: <strong th:text="${traceId}">REF-1234</strong>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold"><i class="bi bi-house me-1"></i> Return to Safety</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary px-4">Browse Catalog</a>
        </div>
    </div>
</body>
</html>
