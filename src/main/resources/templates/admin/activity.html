<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Audit & Activity Monitor - HealthCart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body class="bg-light">

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-journal-text me-2 text-dark"></i>System Audit & Activity Monitor</h2>
                    <span class="text-muted small">FR-AD4: Tamper-evident activity trail for authentication, catalog updates, order transitions, and role revisions</span>
                </div>
            </div>

            <!-- Filter Controls Form -->
            <div class="card border rounded-4 shadow-sm bg-white p-3 mb-4">
                <form th:action="@{/admin/activity}" method="get" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small fw-bold text-muted mb-1">Actor Email</label>
                        <input type="text" name="actor" th:value="${actor}" class="form-control form-control-sm" placeholder="user@domain.com">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold text-muted mb-1">Action Type</label>
                        <input type="text" name="action" th:value="${action}" class="form-control form-control-sm" placeholder="e.g. LOGIN_SUCCESS, ORDER_PLACED">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold text-muted mb-1">From Date</label>
                        <input type="date" name="fromDate" th:value="${fromDate}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold text-muted mb-1">To Date</label>
                        <input type="date" name="toDate" th:value="${toDate}" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary btn-sm w-100" type="submit"><i class="bi bi-funnel me-1"></i> Filter Logs</button>
                    </div>
                </form>
            </div>

            <!-- Audit Logs Table -->
            <div class="card border rounded-4 shadow-sm bg-white overflow-hidden mb-4">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 font-monospace small">
                        <thead class="table-light font-sans-serif">
                            <tr>
                                <th scope="col" class="ps-4">Timestamp</th>
                                <th scope="col">Actor</th>
                                <th scope="col">Action</th>
                                <th scope="col">Entity</th>
                                <th scope="col">IP Address</th>
                                <th scope="col" class="pe-4">Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${logs.empty}">
                                <td colspan="6" class="text-center text-muted py-4">No audit logs matching query</td>
                            </tr>
                            <tr th:each="log : ${logs.content}">
                                <td class="ps-4 text-nowrap text-muted" th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}">Timestamp</td>
                                <td class="fw-semibold text-dark" th:text="${log.actorEmail != null ? log.actorEmail : 'SYSTEM'}">Actor</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${log.action}">Action</span>
                                </td>
                                <td class="text-muted" th:text="${log.entity + (log.entityId != null ? ':' + log.entityId : '')}">Entity</td>
                                <td class="text-muted" th:text="${log.ipAddress}">IP</td>
                                <td class="pe-4 text-truncate" style="max-width: 320px;" th:text="${log.details}">Details</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" aria-label="Audit logs pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/activity(page=${currentPage - 1}, actor=${actor}, action=${action}, fromDate=${fromDate}, toDate=${toDate})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/activity(page=${i}, actor=${actor}, action=${action}, fromDate=${fromDate}, toDate=${toDate})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/activity(page=${currentPage + 1}, actor=${actor}, action=${action}, fromDate=${fromDate}, toDate=${toDate})}">&raquo;</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

</body>
</html>
