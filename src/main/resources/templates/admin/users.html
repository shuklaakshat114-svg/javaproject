<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - HealthCart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body class="bg-light">

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-people me-2 text-primary"></i>User & Role Management</h2>
                    <span class="text-muted small">FR-AD1: Deactivate, delete, or reassign roles for buyer and seller accounts</span>
                </div>
                <!-- Search & Role Filter Form -->
                <form th:action="@{/admin/users}" method="get" class="d-flex align-items-center gap-2 mt-2 mt-md-0">
                    <input type="text" name="query" th:value="${query}" class="form-control form-control-sm" placeholder="Search name or email...">
                    <select name="role" class="form-select form-select-sm" style="width: 150px;">
                        <option value="" th:selected="${selectedRole == null}">All Roles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${selectedRole == r}"></option>
                    </select>
                    <button class="btn btn-outline-primary btn-sm" type="submit">Filter</button>
                </form>
            </div>

            <div class="card border rounded-4 shadow-sm bg-white overflow-hidden mb-4">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="ps-4">User</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                                <th scope="col">Account Status</th>
                                <th scope="col">Registered</th>
                                <th scope="col" class="pe-4 text-end">Governance Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users.content}">
                                <td class="ps-4 py-3">
                                    <div class="fw-bold text-dark" th:text="${user.name}">User Name</div>
                                    <small class="text-muted" th:text="'ID: ' + ${user.id}">ID: 1</small>
                                </td>
                                <td th:text="${user.email}">user@example.com</td>
                                <td>
                                    <!-- Role Change Form -->
                                    <form th:action="@{'/admin/users/' + ${user.id} + '/role'}" method="post" class="d-inline">
                                        <select name="role" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${user.role == r}"></option>
                                        </select>
                                    </form>
                                </td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
                                    <span th:unless="${user.enabled}" class="badge bg-danger-subtle text-danger border border-danger-subtle">Disabled</span>
                                    <span th:if="${!user.isAccountNonLocked()}" class="badge bg-warning text-dark ms-1">Locked</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</td>
                                <td class="pe-4 text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <!-- Toggle Status Form -->
                                        <form th:action="@{'/admin/users/' + ${user.id} + '/toggle-status'}" method="post">
                                            <input type="hidden" name="enabled" th:value="${!user.enabled}">
                                            <button class="btn btn-sm" th:classappend="${user.enabled} ? 'btn-outline-warning' : 'btn-outline-success'" type="submit" th:title="${user.enabled} ? 'Deactivate Account' : 'Activate Account'">
                                                <i class="bi" th:classappend="${user.enabled} ? 'bi-person-x' : 'bi-person-check'"></i>
                                                <span th:text="${user.enabled} ? 'Deactivate' : 'Activate'"></span>
                                            </button>
                                        </form>

                                        <!-- Delete User Form -->
                                        <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to permanently delete this user?');">
                                            <button class="btn btn-outline-danger btn-sm" type="submit" title="Delete User">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" aria-label="Users pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, query=${query}, role=${selectedRole})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i}, query=${query}, role=${selectedRole})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, query=${query}, role=${selectedRole})}">&raquo;</a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</div>

</body>
</html>
