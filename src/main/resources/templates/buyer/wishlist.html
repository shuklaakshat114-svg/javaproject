<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body>

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container">
            <h2 class="fw-bold mb-4"><i class="bi bi-heart me-2 text-danger"></i>My Saved Wishlist</h2>

            <div th:if="${wishlistItems.empty}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
                <i class="bi bi-heartbreak display-2 text-muted"></i>
                <h4 class="fw-bold mt-3">Your wishlist is currently empty</h4>
                <p class="text-muted small">Save items you want to keep an eye on or purchase later.</p>
                <a th:href="@{/products}" class="btn btn-outline-primary mt-2">Browse Healthcare Catalog</a>
            </div>

            <div th:unless="${wishlistItems.empty}" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <div class="col" th:each="item : ${wishlistItems}">
                    <div class="product-card">
                        <div class="product-img-box">
                            <span th:if="${item.product.rxRequired}" class="product-badge-rx"><i class="bi bi-file-medical me-1"></i> Rx Required</span>
                            <i class="bi bi-capsule display-4 text-secondary opacity-50"></i>
                        </div>
                        <div class="card-body p-3 d-flex flex-column">
                            <span class="text-uppercase small fw-bold text-muted mb-1" th:text="${item.product.category.name}">Category</span>
                            <h6 class="fw-bold mb-2">
                                <a th:href="@{'/products/' + ${item.product.id}}" class="text-dark text-decoration-none text-truncate d-block" th:text="${item.product.name}">Product Name</a>
                            </h6>
                            <div class="fs-5 fw-bold text-dark mb-3">₹[[${item.product.price}]]</div>

                            <div class="mt-auto d-flex gap-2">
                                <form th:action="@{/buyer/wishlist/move-to-cart}" method="post" class="flex-grow-1">
                                    <input type="hidden" name="productId" th:value="${item.product.id}">
                                    <button class="btn btn-primary btn-sm w-100" type="submit" th:disabled="${item.product.isOutOfStock()}">
                                        <i class="bi bi-cart-plus me-1"></i> Move to Cart
                                    </button>
                                </form>
                                <form th:action="@{/buyer/wishlist/toggle}" method="post">
                                    <input type="hidden" name="productId" th:value="${item.product.id}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit" title="Remove">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
