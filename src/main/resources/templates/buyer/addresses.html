<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Addresses - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body>

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container">
            <h2 class="fw-bold mb-4"><i class="bi bi-geo-alt me-2 text-primary"></i>Manage Delivery Addresses</h2>

            <div class="row g-4">
                <!-- Saved Addresses List -->
                <div class="col-lg-7">
                    <div th:if="${addresses.empty}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
                        <i class="bi bi-geo display-3 text-muted"></i>
                        <h5 class="fw-bold mt-3">No delivery address saved</h5>
                        <p class="text-muted small">Add your primary residence or clinic address using the form on the right.</p>
                    </div>

                    <div th:unless="${addresses.empty}" class="row g-3">
                        <div class="col-12" th:each="addr : ${addresses}">
                            <div class="card p-3 border rounded-3 bg-white position-relative shadow-sm">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div class="fw-bold text-dark fs-5" th:text="${addr.fullName}">Full Name</div>
                                    <span th:if="${addr.isDefault()}" class="badge bg-primary">Default Address</span>
                                </div>
                                <div class="text-muted small" th:text="${addr.line1}">Line 1</div>
                                <div class="text-muted small" th:if="${addr.line2}" th:text="${addr.line2}">Line 2</div>
                                <div class="text-muted small" th:text="${addr.city + ', ' + addr.state + ' - ' + addr.postalCode}">City, State - PIN</div>
                                <div class="text-dark small fw-semibold mt-2"><i class="bi bi-telephone me-1"></i> [[${addr.phone}]]</div>

                                <div class="d-flex gap-2 mt-3 pt-2 border-top">
                                    <form th:unless="${addr.isDefault()}" th:action="@{'/buyer/addresses/' + ${addr.id} + '/default'}" method="post">
                                        <button class="btn btn-outline-secondary btn-sm" type="submit">Set as Default</button>
                                    </form>
                                    <form th:action="@{'/buyer/addresses/' + ${addr.id} + '/delete'}" method="post">
                                        <button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-trash me-1"></i> Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add New Address Form -->
                <div class="col-lg-5">
                    <div class="card border rounded-4 shadow-sm bg-white p-4">
                        <h5 class="fw-bold mb-3 border-bottom pb-2">+ Add New Delivery Address</h5>

                        <form th:action="@{/buyer/addresses}" th:object="${addressForm}" method="post">
                            <div class="mb-3">
                                <label for="fullName" class="form-label small fw-bold text-muted">Recipient Name</label>
                                <input type="text" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" id="fullName" th:field="*{fullName}" placeholder="John Doe">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="line1" class="form-label small fw-bold text-muted">Street Address Line 1</label>
                                <input type="text" class="form-control" th:classappend="${#fields.hasErrors('line1')} ? 'is-invalid'" id="line1" th:field="*{line1}" placeholder="House/Flat No, Street name">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('line1')}" th:errors="*{line1}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="line2" class="form-label small fw-bold text-muted">Street Address Line 2 (Optional)</label>
                                <input type="text" class="form-control" id="line2" th:field="*{line2}" placeholder="Apartment, Landmark, Area">
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="city" class="form-label small fw-bold text-muted">City</label>
                                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" id="city" th:field="*{city}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="state" class="form-label small fw-bold text-muted">State</label>
                                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('state')} ? 'is-invalid'" id="state" th:field="*{state}">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                                </div>
                            </div>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <label for="postalCode" class="form-label small fw-bold text-muted">Postal Code</label>
                                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid'" id="postalCode" th:field="*{postalCode}" placeholder="560103">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
                                </div>
                                <div class="col-6">
                                    <label for="phone" class="form-label small fw-bold text-muted">Phone Number</label>
                                    <input type="text" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" id="phone" th:field="*{phone}" placeholder="+91 9876543210">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save Address</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
