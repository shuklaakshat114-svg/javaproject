<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body>

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container">
            <h2 class="fw-bold mb-4"><i class="bi bi-box-seam me-2 text-primary"></i>My Order History</h2>

            <div th:if="${orders.empty}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
                <i class="bi bi-receipt display-2 text-muted"></i>
                <h4 class="fw-bold mt-3">No orders found</h4>
                <p class="text-muted small">You haven't placed any orders yet.</p>
                <a th:href="@{/products}" class="btn btn-primary mt-2">Start Shopping</a>
            </div>

            <div th:unless="${orders.empty}">
                <div class="card border rounded-4 shadow-sm bg-white overflow-hidden mb-4">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="ps-4">Order #</th>
                                    <th scope="col">Date Placed</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Payment</th>
                                    <th scope="col">Total</th>
                                    <th scope="col" class="pe-4 text-end">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders.content}">
                                    <td class="ps-4 py-3 fw-bold">
                                        <a th:href="@{'/buyer/orders/' + ${order.id}}" class="text-primary text-decoration-none" th:text="${order.orderNumber}">HC-XXXX</a>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">Date</td>
                                    <td>
                                        <span class="badge" th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' : (${order.status.name() == 'CANCELLED' || order.status.name() == 'PAYMENT_FAILED'} ? 'bg-danger' : 'bg-primary')" th:text="${order.status.displayName}">Status</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${order.paymentStatus == 'COMPLETED'} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-warning-subtle text-warning border border-warning-subtle'" th:text="${order.paymentStatus}">PENDING</span>
                                    </td>
                                    <td class="fw-bold text-dark">₹[[${order.totalAmount}]]</td>
                                    <td class="pe-4 text-end">
                                        <a th:href="@{'/buyer/orders/' + ${order.id}}" class="btn btn-outline-primary btn-sm">
                                            Track Order <i class="bi bi-chevron-right ms-1"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" aria-label="Orders pagination">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/buyer/orders(page=${currentPage - 1})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/buyer/orders(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/buyer/orders(page=${currentPage + 1})}">&raquo;</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</div>

</body>
</html>
