<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browsing History - HealthCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/healthcart.css}">
</head>
<body>

<div th:replace="~{layout/main :: body}">
    <div th:fragment="content">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Recently Viewed Products</h2>
                <form th:if="${!recentViews.empty}" th:action="@{/buyer/history/clear}" method="post">
                    <button class="btn btn-outline-danger btn-sm" type="submit">
                        <i class="bi bi-trash me-1"></i> Clear History
                    </button>
                </form>
            </div>

            <div th:if="${recentViews.empty}" class="text-center py-5 bg-white rounded-4 border shadow-sm">
                <i class="bi bi-eye-slash display-2 text-muted"></i>
                <h4 class="fw-bold mt-3">No browsing history yet</h4>
                <p class="text-muted small">Products you explore in the catalog will appear here for easy reference.</p>
                <a th:href="@{/products}" class="btn btn-primary mt-2">Explore Catalog</a>
            </div>

            <div th:unless="${recentViews.empty}" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                <div class="col" th:each="entry : ${recentViews}">
                    <div class="product-card">
                        <div class="product-img-box">
                            <i class="bi bi-capsule display-4 text-secondary opacity-50"></i>
                        </div>
                        <div class="card-body p-3 d-flex flex-column">
                            <span class="text-uppercase small fw-bold text-muted mb-1" th:text="${entry.product.category.name}">Category</span>
                            <h6 class="fw-bold mb-2">
                                <a th:href="@{'/products/' + ${entry.product.id}}" class="text-dark text-decoration-none text-truncate d-block" th:text="${entry.product.name}">Product Name</a>
                            </h6>
                            <div class="fs-5 fw-bold text-dark mb-2">₹[[${entry.product.price}]]</div>
                            <small class="text-muted mb-3 d-block">
                                <i class="bi bi-clock me-1"></i> Viewed on [[${#temporals.format(entry.viewedAt, 'dd MMM, HH:mm')}]]
                            </small>
                            <a th:href="@{'/products/' + ${entry.product.id}}" class="btn btn-outline-primary btn-sm mt-auto">View Again</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
