server:
  port: 8080
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

spring:
  application:
    name: healthcart
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:healthcartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

app:
  storage:
    root: ${STORAGE_ROOT:./uploads}
  payment:
    provider: ${PAYMENT_PROVIDER:RAZORPAY}
    key-id: ${PAYMENT_KEY_ID:rzp_test_healthcart123}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:hc_secret_super_secure_key_123456}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.healthcart: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
